[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "lightgbm-callbacks"
version = "1.0.0"
description = "A collection of LightGBM callbacks."
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
  { name = "Microsoft Corporation" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "lightgbm>=4.7.0,<5",
  "scikit-learn>=1.3.1,<2",
  "tqdm>=4.65,<5",
  "typing-extensions>=4.5,<5",
]
urls."Bug Tracker" = "https://github.com/34j/lightgbm-callbacks/issues"
urls.Changelog = "https://github.com/34j/lightgbm-callbacks/blob/main/CHANGELOG.md"
urls.documentation = "https://lightgbm-callbacks.readthedocs.io"
urls.repository = "https://github.com/34j/lightgbm-callbacks"

[dependency-groups]
dev = [
  "coverage",
  "graphviz",
  "matplotlib",
  "matplotx",
  "packaging-34j[test]",
  "parameterized",
  "pytest",
  "pytest-cov",
  "rich",
  "ty",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.select = [ "B", "C4", "D", "E", "F", "I", "RUF", "S", "UP", "W" ]
lint.ignore = [
  "B028",
  "B905",
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D107",   # Missing docstring in __init__
  "D203",   # 1 blank line required before class docstring
  "D205",
  "D212",   # Multi-line summary should start at the first line
  "D213",
  "D401",   # First line should be in imperative mood
  "D413",
  "D417",
  "E501",
  "RUF005", # Preserve the existing callback list style
  "S301",
  "S403",
  "UP007",
  "UP035",
  "UP046",
  "UP047",
]
lint.extend-per-file-ignores."docs/conf.py" = [ "ALL" ]
lint.extend-per-file-ignores."tests/**/*" = [
  "B007",
  "B028",
  "B905",
  "D",
  "D205",
  "D213",
  "D413",
  "D417",
  "E501",
  "F401",
  "INP001",
  "N806",
  "PGH003",
  "PLW2901",
  "PT009",
  "RUF100",
  "S101",
  "S301",
  "S403",
  "T201",
  "TC002",
  "UP007",
  "UP035",
  "UP046",
  "UP047",
]
lint.extend-per-file-ignores."tests/conftest.py" = [ "S404", "S607" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
